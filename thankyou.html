<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3EZHKE3VNP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3EZHKE3VNP');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Campus Painting</title>
  <meta name="description" content="Thanks for requesting a free painting estimate from Campus Painting. We'll be in touch shortly." />
  <!-- Keep this confirmation page out of search results -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://campuspainting.ca/thankyou" />
  <link rel="icon" type="image/jpeg" href="photos/logopng.jpg" />

  <!-- No-JS fallback: still returns home after 3 seconds -->
  <noscript><meta http-equiv="refresh" content="3;url=/" /></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sygne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], sygne: ['Sygne', 'sans-serif'] },
      boxShadow: { 'grey-glow': '0 0 50px -10px rgba(255,255,255,0.09)' }
    } } }
  </script>
  <style>
    :root { --brand-orange: #ea580c; --brand-red: #dc2626; }
    .brand-pill-btn { background: linear-gradient(135deg, var(--brand-orange), var(--brand-red)); transition: all .3s cubic-bezier(.16,1,.3,1); }
    .brand-pill-btn:hover { box-shadow: 0 0 25px rgba(234,88,12,.45); transform: translateY(-2px); }
    .grey-glow-spot { background: radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 45%, transparent 70%); }
    .bar { animation: fill 3s linear forwards; transform-origin: left; }
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleX(1); } }
  </style>
</head>

<body class="bg-black text-neutral-100 font-sans antialiased overflow-x-hidden flex flex-col min-h-screen">

  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[500px] grey-glow-spot blur-3xl"></div>
  </div>

  <header class="sticky top-0 z-50 backdrop-blur-xl bg-black/80 border-b border-neutral-900">
    <nav class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between" aria-label="Main navigation">
      <a href="/" class="flex flex-col tracking-wider" aria-label="Campus Painting home">
        <span class="text-sm font-black tracking-widest uppercase text-white leading-tight">Campus</span>
        <span class="text-xs font-semibold tracking-[0.2em] uppercase text-neutral-400">Painting</span>
      </a>
      <a href="tel:5197788171" class="brand-pill-btn text-white text-xs uppercase tracking-wider font-semibold px-6 py-2.5 rounded-full">(519) 778-8171</a>
    </nav>
  </header>

  <main class="relative z-10 flex-grow flex items-center justify-center py-16 px-6">
    <section class="w-full max-w-xl bg-[#0a0a0c] border border-neutral-800/90 rounded-2xl p-10 shadow-grey-glow text-center" aria-live="polite">
      <div class="w-16 h-16 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center mx-auto mb-6">
        <i data-lucide="check" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight uppercase text-white mb-4">Thank You!</h1>
      <p class="font-sygne text-sm sm:text-base text-neutral-300 leading-relaxed tracking-wide mb-8">
        Your estimate request is in. We'll contact you shortly to talk through your project.
      </p>
      <div class="h-1 w-full bg-neutral-800 rounded-full overflow-hidden mb-3" aria-hidden="true">
        <div class="bar h-full w-full brand-pill-btn rounded-full"></div>
      </div>
      <p class="text-xs text-neutral-500 mb-6">Returning to the home page in 3 seconds...</p>
      <a href="/" class="text-xs uppercase tracking-wider font-semibold text-neutral-400 hover:text-white underline underline-offset-4">Go to home page now</a>
    </section>
  </main>

  <script>
    lucide.createIcons();

    // Only stay on this page if the form was actually submitted
    let submitted = false;
    try { submitted = sessionStorage.getItem('quoteSubmitted') === '1'; } catch (_) {}

    if (!submitted) {
      window.location.replace('/quote');
    } else {
      try { sessionStorage.removeItem('quoteSubmitted'); } catch (_) {}
      setTimeout(() => { window.location.href = '/'; }, 3000);
    }
  </script>
</body>
</html>
